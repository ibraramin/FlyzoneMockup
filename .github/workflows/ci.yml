name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fail the build on NuGet vulnerability warnings (NU1901-NU1905).
      # MSBuild needs semicolons percent-encoded in command-line properties.
      - name: Restore (audit as errors)
        run: dotnet restore -p:NuGetAudit=true -p:TreatWarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905

      - name: Build (Release)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Audit report
        if: always()
        run: dotnet list package --vulnerable --include-transitive
